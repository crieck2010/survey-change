[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-change"
version = "0.1.0"
description = "Change-detection engine for surveying and remote sensing: multi-method raster differencing, change vector analysis, post-classification comparison, change polygons, and QGIS-ready outputs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "crieck2010" }]
keywords = ["surveying", "remote-sensing", "change-detection", "raster", "GIS", "QGIS", "sentinel-2", "landsat"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.22",
    "rasterio>=1.3",
]

[project.optional-dependencies]
dev = ["build", "twine"]

[project.scripts]
survey-change = "change.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/survey-change"
Repository = "https://github.com/crieck2010/survey-change"
Issues = "https://github.com/crieck2010/survey-change/issues"

[tool.setuptools.packages.find]
where = ["src"]
